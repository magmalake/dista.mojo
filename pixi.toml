[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "dista.mojo"
version = "0.0.1"
description = "Distributed tasks for Mojo: mark a function remote, call it, and the work runs across a cluster."
preview = ["pixi-build"]
# linux-aarch64 lets the container image build natively on ARM hosts, such as
# Docker on Apple silicon.
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
test-codec = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_codec.mojo -o build/test-codec && ./build/test-codec" }
test-frame = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_frame.mojo -o build/test-frame && ./build/test-frame" }
test-runtime = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_runtime.mojo -o build/test-runtime && ./build/test-runtime" }
test-batches = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_batches.mojo -o build/test-batches && ./build/test-batches" }
test-free = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_free.mojo -o build/test-free && ./build/test-free" }
test-cluster = { cmd = "tests/cluster.sh" }
test-restart = { cmd = "tests/head_restart.sh" }
test-chaos = { cmd = "tests/chaos.sh" }
test-kind = { cmd = "tests/kind.sh" }
test = { depends-on = ["test-codec", "test-frame", "test-runtime", "test-batches", "test-free", "test-cluster", "test-restart", "test-chaos"] }
bench = { cmd = "mkdir -p build && mojo build -I src $DEP_INC bench/fanout.mojo -o build/bench-fanout && ./build/bench-fanout" }

[package]
name = "dista-mojo"
version = "0.0.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/dista"
name = "dista"

[package.host-dependencies]
mojo-compiler = "==1.2.0"
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "928a2435371c82395879779225df284e581dfb21" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "91ff4418b44a89f9354e7d32633e9b11ad365dfd" }

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<2"
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "928a2435371c82395879779225df284e581dfb21" }
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "91ff4418b44a89f9354e7d32633e9b11ad365dfd" }

# Stable is the default: dista targets Mojo 1.2.0. The nightly environment
# tracks 1.3.0.dev so breaking changes show up early.
[feature.stable.dependencies]
mojo-compiler = "==1.2.0"
# memory-region backs the node-local object store: large results go into
# shared mappings that other processes on the same host map by path. Pinned
# at the revision mojoshelf published (memory-region-mojo 0.1.0).
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "91ff4418b44a89f9354e7d32633e9b11ad365dfd" }
# arrow-mlake carries columnar results: a task can take or return a
# RecordBatch, and it travels as an Arrow IPC stream. Pinned at the revision
# mojoshelf published as arrow-mlake-mojo 0.2.0.
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "928a2435371c82395879779225df284e581dfb21" }

# A precompiled package only loads in the compiler that built it, and this one
# is 1.2.0's, so the nightly compiles memory-region and arrow-mlake from
# checkouts next door instead (CI lays them out). The packages must not be
# installed there too: an installed package wins over -I. DEP_INC holds the
# include flags for whichever way the environment gets them.
[feature.stable.activation.env]
DEP_INC = "-I src"

[feature.nightly.activation.env]
DEP_INC = "-I ../memory-region.mojo/src -I ../arrow-mlake.mojo/src"

[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

# `mojo-compiler` ships no formatter; the nightly `modular` package does. The
# environment takes `no-default-feature`, so its tasks live in the feature.
# `mojo format` has no check mode, so format-check formats and then asserts
# the tree did not move.
[feature.fmt.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.fmt.tasks]
fmt = { cmd = "mojo format src tests bench examples deploy fuzz" }
format-check = { cmd = "mojo format src tests bench examples deploy fuzz && git diff --exit-code -- src tests bench examples deploy fuzz" }

# The data environment runs dista tasks over parquet.mojo and iceberg.mojo.
# Their Mojo sources compile from checkouts next to this one, as their own
# tests do, rather than as packages: parquet-mojo and iceberg-mojo's published
# packages pin an older arrow-mlake, and two builds of one package can't share
# an environment. CI lays the checkouts out at the revisions iceberg-mojo
# 0.8.2 was published with. The FFI tins are packages as well as checkouts:
# the package is what installs the C shim each one links.
[feature.data.dependencies]
mojo-compiler = "==1.2.0"
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "ad16cc3edc419cf23d7360a579836ffd621b36f1" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "53655623ca8585fd5b36b1239842913ec308ae69" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "64502eeeabed37515cd479bc421fc2920504cac5" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "aa6d14985baf82ad4b934f14136b95a291b55faf" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "53b819cd395b1b0afe8772dfbb43489da6ce939e" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "bfe9b94ae97e3e184dc6d118b0684818927a5da8" }
libcurl = ">=8,<9"
libsqlite = ">=3.45,<4"
libpq = ">=16,<19"

[feature.data.activation.env]
DEP_INC = "-I ../memory-region.mojo/src -I ../arrow-mlake.mojo/src -I ../parquet.mojo/src -I ../parquet.mojo/full/src -I ../threads.mojo/src -I ../threads.mojo/compat -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../deflate.mojo/src -I ../avro.mojo/src -I ../roaring.mojo/src -I ../objectstore.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -I ../sqlite.mojo -I ../postgres.mojo/src -I ../iceberg.mojo/src"

[feature.data.tasks]
test-parquet = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_parquet_tasks.mojo -o build/test-parquet && ./build/test-parquet" }
test-iceberg = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_iceberg_scan.mojo -o build/test-iceberg && ./build/test-iceberg" }
test-data = { depends-on = ["test-parquet", "test-iceberg"] }

# Fuzzing with mozz (packaged for magmalake as mozz_mlake), as flare does: one
# harness per parser or protocol under fuzz/, built with every bounds check
# on. Each harness writes the input it's running to build/fuzz-<name>-last.bin
# first, so a hard abort still leaves the crashing input behind; mozz saves
# the ones it catches to build/fuzz-crashes/. FUZZ_RUNS sets the iterations.
[feature.fuzz.dependencies]
mozz_mlake = { git = "https://github.com/magmalake/mozz_mlake.git", rev = "bd84a1f1e376912414a3ddcf0f4151ed65435a44" }

[feature.fuzz.tasks]
fuzz-frames = { cmd = "mkdir -p build && mojo build -D ASSERT=all -I src $DEP_INC fuzz/fuzz_frames.mojo -o build/fuzz-frames && ./build/fuzz-frames" }
fuzz-codec = { cmd = "mkdir -p build && mojo build -D ASSERT=all -I src $DEP_INC fuzz/fuzz_codec.mojo -o build/fuzz-codec && ./build/fuzz-codec" }
fuzz-payloads = { cmd = "mkdir -p build && mojo build -D ASSERT=all -I src $DEP_INC fuzz/fuzz_payloads.mojo -o build/fuzz-payloads && ./build/fuzz-payloads" }
fuzz-head = { cmd = "mkdir -p build && mojo build -D ASSERT=all -I src $DEP_INC fuzz/fuzz_head.mojo -o build/fuzz-head && ./build/fuzz-head" }
fuzz = { depends-on = ["fuzz-frames", "fuzz-codec", "fuzz-payloads", "fuzz-head"] }

[environments]
default = ["stable"]
fuzz = ["stable", "fuzz"]
nightly = ["nightly"]
fmt = { features = ["fmt"], no-default-feature = true }
data = { features = ["data"], no-default-feature = true }
