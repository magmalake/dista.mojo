# bench/rust on the EC2 cluster: @SLOTS@ single-threaded workers on each of
# the first @NODES@ worker nodes behind a headless Service, and the driver on
# the head node. There's no head. bench/cloud/run.sh fills in the @...@
# values; the `aws` Secret holds the AWS_* variables the S3 reads use.
apiVersion: v1
kind: Service
metadata:
  name: rust-workers
spec:
  clusterIP: None
  selector: {app: rust-taxi, role: worker}
  ports:
    - {name: taxi, port: 7400}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-worker
spec:
  replicas: @REPLICAS@
  selector:
    matchLabels: {app: rust-taxi, role: worker}
  template:
    metadata:
      labels: {app: rust-taxi, role: worker}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: dista-bench/rank, operator: Lt, values: ["@NODES@"]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: rust-taxi, role: worker}
      containers:
        - name: worker
          image: dista-rust:taxi
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: aws}
          env:
            - {name: TAXI_ROLE, value: worker}
            - {name: TAXI_THREADS, value: "1"}
            - {name: TAXI_METADATA, value: "@TAXI_METADATA@"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          readinessProbe:
            tcpSocket: {port: 7400}
            periodSeconds: 2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: taxi
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: rust-taxi, role: driver}
    spec:
      restartPolicy: Never
      nodeSelector: {dista-bench/role: head}
      containers:
        - name: driver
          image: dista-rust:taxi
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: aws}
          env:
            - {name: TAXI_WORKERS, value: "rust-workers:7400"}
            - {name: TAXI_EXPECT_WORKERS, value: "@REPLICAS@"}
            - {name: DISTA_EXPECT_NODES, value: "@NODES@"}
            - {name: TAXI_THREADS, value: "1"}
            - {name: TAXI_METADATA, value: "@TAXI_METADATA@"}
            - {name: TAXI_PASSES, value: "@PASSES@"}
            - {name: TAXI_MODE, value: distributed}
