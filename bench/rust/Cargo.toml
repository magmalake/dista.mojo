[package]
name = "taxi-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The dista taxi gate in Rust: one task per Iceberg data file over TCP, on iceberg-rust."
publish = false

[dependencies]
iceberg = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-fs", "opendal-s3"] }
arrow = { version = "58", default-features = false, features = ["ipc"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
