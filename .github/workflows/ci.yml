name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, nightly and by hand (Actions > CI > Run workflow), not on
  # PRs or main: its jobs aren't required, and they held runners from the
  # org's small macOS pool that every repo's PRs share.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# A new push to a PR cancels its runs still going: only the latest commit's
# results matter, and the old run's jobs held runners the org shares. Pushes
# to main each run to the end (the group is the commit there).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the nightly leg, kind,
  # fuzz and the data shards below, and runs a consumer build of the PR head
  # instead. The verdict is its own fast job because the jobs below wait for
  # it; the build is the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The test legs below are skipped on release PRs, and the consumer build
      # is the check (the tests build against sibling checkouts of the other tins).
      task: ""

  # Whether the PR changes anything but prose (*.md, docs/, the licence
  # files), which no test, build or check reads. Pushes, the nightly, runs by
  # hand, and a failure here all count as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)' || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.env == 'default' && 'stable' || matrix.env }} / ${{ matrix.os }}
    needs: [changes, release]
    # Runs even if `changes` failed: then everything does.
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        env: [default, nightly]
    defaults:
      run:
        working-directory: dista.mojo
    steps:
      # dista's required checks: for a prose-only PR the job runs and passes,
      # its steps skipped, so the checks still report.
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v4
        with:
          path: dista.mojo

      # The nightly compiles memory-region, arrow-mlake, objectstore and threads from source,
      # because their packages are precompiled by 1.2.0 and a 1.3 compiler
      # refuses them. The refs match the pins in pixi.toml.
      - if: needs.changes.outputs.code != 'false' && (matrix.env == 'nightly')
        uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e
          path: memory-region.mojo
      - if: needs.changes.outputs.code != 'false' && (matrix.env == 'nightly')
        uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda
          path: arrow-mlake.mojo
      - if: needs.changes.outputs.code != 'false' && (matrix.env == 'nightly')
        uses: actions/checkout@v4
        with:
          repository: magmalake/objectstore.mojo
          ref: ff66975c095f392695facc1b6dd56823dec914bc
          path: objectstore.mojo
      - if: needs.changes.outputs.code != 'false' && (matrix.env == 'nightly')
        uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          ref: f45e780a8de77278c140cee36904e46e93e0ca1c
          path: threads.mojo

      - if: needs.changes.outputs.code != 'false'
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}
          manifest-path: dista.mojo/pixi.toml
          # Only main and the nightly write the environment cache. Every PR
          # writing ~1 GB per environment kept the repository over GitHub's
          # 10 GB cap, which evicted main's entries: the only ones every PR can
          # read.
          cache-write: ${{ github.event_name != 'pull_request' }}

      # Mojo's compile cache (share/max/cache in the environment) starts
      # empty in every job. Restored from main's last run, it makes builds of
      # code main has built already 4-6x faster. It's content-addressed, so a
      # stale entry is never used. Saved by main and the nightly, like the
      # environment.
      - if: needs.changes.outputs.code != 'false'
        uses: actions/cache/restore@v4
        with:
          path: dista.mojo/.pixi/envs/${{ matrix.env }}/share/max/cache
          key: mojo-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('dista.mojo/pixi.lock') }}-${{ github.run_id }}
          restore-keys: mojo-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('dista.mojo/pixi.lock') }}-

      # The frame and runtime tests fork real processes and talk over
      # loopback TCP. Linux is the leg that checks the socket layer's
      # platform constants: sockaddr_in's first byte, SOL_SOCKET and
      # MSG_NOSIGNAL all differ from macOS.
      - if: needs.changes.outputs.code != 'false'
        name: Tests
        run: pixi run -e ${{ matrix.env }} test

      # Entries a week old go before saving, so the cache can't grow without
      # bound; one still in use is rebuilt once.
      - if: always() && needs.changes.outputs.code != 'false' && github.event_name != 'pull_request'
        name: Prune Mojo's compile cache
        run: find .pixi/envs/${{ matrix.env }}/share/max/cache -type f -mtime +7 -delete || true
      - if: always() && needs.changes.outputs.code != 'false' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: dista.mojo/.pixi/envs/${{ matrix.env }}/share/max/cache
          key: mojo-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('dista.mojo/pixi.lock') }}-${{ github.run_id }}

  # Tasks over Parquet and Iceberg. parquet.mojo, iceberg.mojo and their
  # siblings compile from source, at the revisions iceberg-mojo 0.8.2 was
  # published with; arrow-mlake at dista's pin; memory-region at the fix that
  # lets it share a binary with the standard library's file seek. See the
  # data environment in pixi.toml.
  data:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dista.mojo
    steps:
      - uses: actions/checkout@v4
        with:
          path: dista.mojo
      - uses: actions/checkout@v4
        with: {repository: magmalake/memory-region.mojo, ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e, path: memory-region.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/arrow-mlake.mojo, ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda, path: arrow-mlake.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/parquet.mojo, ref: 9a596283d3612d1ebeca199f9e48f1c1a7eaab51, path: parquet.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/iceberg.mojo, ref: 571f60ad8408dc8a9999ca0feffd506343333e59, path: iceberg.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/threads.mojo, ref: f45e780a8de77278c140cee36904e46e93e0ca1c, path: threads.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/thrift.mojo, ref: 21cdbce67d22d72e88e88a60e2f168b05b4ef9fa, path: thrift.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/hashes.mojo, ref: 395aca597f9410bd0511df44d972f14b10a8b01d, path: hashes.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/snappy.mojo, ref: b8172ed0a4ef13911cc225d46e26676a5b8f1ccd, path: snappy.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/deflate.mojo, ref: aeb571e54ac736b97c826a23f44501715fddc656, path: deflate.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/avro.mojo, ref: 479c9d390b5c12c2497e05f84b64bf690a8cfea3, path: avro.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/roaring.mojo, ref: a90a7bd30cf1c21403a29059282072e93fbeeee2, path: roaring.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/objectstore.mojo, ref: ff66975c095f392695facc1b6dd56823dec914bc, path: objectstore.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/zstd.mojo, ref: 76190bb31012cd2d2f6712c4e1724a66474215db, path: zstd.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/lz4.mojo, ref: 23cd6e54967d7e41573371507228ca5c958ca685, path: lz4.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/brotli.mojo, ref: dcbf840d22e3deaf24c587d12d28570a9a882b7f, path: brotli.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/sqlite.mojo, ref: 0d76aa7b672c85580f4d8c5de855772bc972d535, path: sqlite.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/postgres.mojo, ref: 324b2bb61e2e80327654abecf70fd4b2defbc50d, path: postgres.mojo}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: data
          manifest-path: dista.mojo/pixi.toml
          cache-write: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache/restore@v4
        with:
          path: dista.mojo/.pixi/envs/data/share/max/cache
          key: mojo-${{ runner.os }}-data-${{ hashFiles('dista.mojo/pixi.lock') }}-${{ github.run_id }}
          restore-keys: mojo-${{ runner.os }}-data-${{ hashFiles('dista.mojo/pixi.lock') }}-
      # Both tests' binaries compiled at once; the steps below copy them
      # (scripts/mojo-build.sh).
      - name: Build the tests
        run: pixi run -e data build-data-tests
      - name: Tasks over Parquet row groups
        run: pixi run -e data test-parquet
      - name: A distributed Iceberg scan equals a local one
        run: pixi run -e data test-iceberg
      - if: always() && github.event_name != 'pull_request'
        name: Prune Mojo's compile cache
        run: find .pixi/envs/data/share/max/cache -type f -mtime +7 -delete || true
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: dista.mojo/.pixi/envs/data/share/max/cache
          key: mojo-${{ runner.os }}-data-${{ hashFiles('dista.mojo/pixi.lock') }}-${{ github.run_id }}

  # The image builds the program with pixi itself, so this job needs only
  # docker, kubectl (both on the runner) and kind.
  kind:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.15.1
        with:
          install_only: true
      - name: Smoke test on a 3-node kind cluster
        run: tests/kind.sh

  # Every fuzz harness under fuzz/, for a short session each, with all bounds
  # checks on. Longer sessions are a FUZZ_RUNS away locally.
  fuzz:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fuzz
          cache-write: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache/restore@v4
        with:
          path: .pixi/envs/fuzz/share/max/cache
          key: mojo-${{ runner.os }}-fuzz-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}
          restore-keys: mojo-${{ runner.os }}-fuzz-${{ hashFiles('pixi.lock') }}-
      - name: Fuzz
        run: FUZZ_RUNS=20000 pixi run -e fuzz fuzz
      - if: failure()
        name: Show the crashing inputs
        run: |
          for f in build/fuzz-*-last.bin; do echo "$f"; xxd "$f" | head -20; done
          ls -R build/fuzz-crashes || true
      - if: always() && github.event_name != 'pull_request'
        name: Prune Mojo's compile cache
        run: find .pixi/envs/fuzz/share/max/cache -type f -mtime +7 -delete || true
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .pixi/envs/fuzz/share/max/cache
          key: mojo-${{ runner.os }}-fuzz-${{ hashFiles('pixi.lock') }}-${{ github.run_id }}

  format:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fmt
          cache-write: ${{ github.event_name != 'pull_request' }}
      - name: Format check
        run: pixi run -e fmt format-check

  # One check for every Linux job above: each passed, or, for a prose-only
  # PR, was skipped. The jobs' own checks still report too, so the ruleset's
  # stable / ubuntu-latest, nightly / ubuntu-latest and format keep working.
  # (macOS runs only on the nightly, which this gate doesn't cover.)
  ci:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [release, release-check, changes, test, data, kind, fuzz, format]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check")
          release_only = release["outputs"].get("release_only") == "true"
          prose_only = needs["changes"]["outputs"].get("code") == "false"
          ok = {"success", "skipped"} if release_only or prose_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "prose-only:", prose_only,
                "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
